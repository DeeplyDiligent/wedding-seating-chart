<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reception Seating Chart</title>
    <!-- Fonts for minimal elegance -->
    <link href="https://fonts.googleapis.com/css2?family=Bellota+Text:wght@400;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --main-bg: #fdf6df;
            --card-bg: #fffbe9;
            --accent-peach: #eab892;
            --accent-peach-dark: #e1a86f;
            --text-dark: #77421e;
            --header-bg: #fffbe9;
            --border-radius: 14px;
            --table-bg: #fffbe9;
            --input-bg: #f8ede2;
            --table-row-lightgold: #fdf8ec; /* very light gold for alt rows */
            --table-row-hover: #fae2cb;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Bellota Text", sans-serif;
            background-color: var(--main-bg);
            padding: 24px;
            color: var(--text-dark);
            min-height: 100vh;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            background-color: var(--card-bg);
            padding: 40px 32px 32px 32px;
            border-radius: var(--border-radius);
            box-shadow: 0 8px 36px rgba(234, 184, 146, 0.07), 0 1.5px 8px rgba(119, 66, 30, 0.06);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 2.6rem;
            color: var(--text-dark); /* dark brown */
            text-align: center;
            margin-bottom: 40px;
            letter-spacing: 1px;
            font-weight: 700;
        }

        .search-box {
            width: 100%;
            padding: 13px 16px;
            font-size: 1rem;
            border: 1.5px solid var(--accent-peach-dark);
            border-radius: 8px;
            margin-bottom: 52px;
            background: var(--input-bg);
            color: var(--text-dark);
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .search-box:focus {
            outline: none;
            border-color: var(--accent-peach);
            box-shadow: 0 0 0 2px #ffe5cb;
        }

        .table-wrapper {
            margin-bottom: 38px;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            background: var(--table-bg);
            border-radius: var(--border-radius);
            overflow: hidden;
            /* Small table shadow */
            box-shadow: 0 2px 16px 0 rgba(234, 184, 146, 0.14), 0 0.5px 2px rgba(119, 66, 30, 0.06);
        }

        th, td {
            padding: 18px 18px;
            text-align: left;
            color: var(--text-dark);
            border: none; /* Remove all cell borders */
        }

        th {
            background-color: var(--accent-peach-dark);
            color: #fff;
            font-weight: 700;
            border: none;
            font-size: 1.1rem;
            letter-spacing: 0.5px;
        }

        /* Center the Table column header and cells */
        th:last-child, td:last-child {
            text-align: center;
        }

        tr:last-child td {
            border-bottom: none;
        }

        /* Alternate row coloring with very light gold */
        tbody tr {
            background: var(--table-bg);
            transition: background 0.2s;
        }
        tbody tr:nth-child(even) {
            background: var(--table-row-lightgold);
        }

        tr:hover {
            background-color: var(--table-row-hover) !important;
        }

        /* Remove the old border for td (no gold line between rows) */
        td {
            font-size: 1.05rem;
        }

        .no-results {
            text-align: center;
            padding: 24px 0 12px 0;
            color: #b07b41;
            font-size: 1.1rem;
            letter-spacing: 0.1px;
        }

        /* MOBILE OVERRIDES */
        @media (max-width: 600px) {
            body {
                padding: 0;
                background: var(--main-bg);
            }
            .container {
                max-width: 100vw;
                width: 100vw;
                min-height: 100vh;
                margin: 0;
                border-radius: 0;
                box-shadow: none;
                padding: 24px 0 0 0;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                justify-content: flex-start;
                background: var(--card-bg);
            }
            h1 {
                font-size: 2rem;
                margin-bottom: 28px;
            }
            .search-box {
                font-size: 0.92rem;
                padding: 14px 20px;
                margin-bottom: 38px;
                margin-left: 8vw;
                margin-right: 8vw;
                width: 84vw;
            }
            .table-wrapper {
                margin-left: 8vw;
                margin-right: 8vw;
                width: 84vw;
                margin-bottom: 40px;
            }
            table {
                border-radius: 16px !important;
                box-shadow: 0 2px 16px 0 rgba(234, 184, 146, 0.16), 0 0.5px 2px rgba(119, 66, 30, 0.08);
                width: 100%;
            }
            th, td {
                padding: 20px 18px;
                font-size: 0.99rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Reception Seating Chart</h1>
        <input type="text" id="searchBox" class="search-box" placeholder="Search by name or table number...">
        <div class="table-wrapper">
            <table id="seatingTable">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Table</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Data will be loaded here -->
                </tbody>
            </table>
        </div>
        <div id="noResults" class="no-results" style="display: none;">No results found</div>
    </div>

    <script>
        let seatingData = [];

        // Load CSV data
        async function loadCSV() {
            try {
                const response = await fetch('seating.csv');
                const text = await response.text();
                const lines = text.trim().split('\n');
                
                // Skip header row
                for (let i = 1; i < lines.length; i++) {
                    const [name, tableNo] = lines[i].split(',');
                    if (name && tableNo) {
                        seatingData.push({
                            name: name.trim(),
                            tableNo: tableNo.trim()
                        });
                    }
                }
                
                displayData(seatingData);
            } catch (error) {
                console.error('Error loading CSV:', error);
                document.getElementById('tableBody').innerHTML = 
                    '<tr><td colspan="2" style="text-align: center;">Error loading seating data</td></tr>';
            }
        }

        // Display data in table
        function displayData(data) {
            const tableBody = document.getElementById('tableBody');
            const noResults = document.getElementById('noResults');
            
            if (data.length === 0) {
                tableBody.innerHTML = '';
                noResults.style.display = 'block';
                return;
            }
            
            noResults.style.display = 'none';
            tableBody.innerHTML = data.map(person => {
                // Bold the last name (everything after the last space)
                const lastSpaceIndex = person.name.lastIndexOf(' ');
                let formattedName;
                if (lastSpaceIndex > 0) {
                    const firstName = person.name.substring(0, lastSpaceIndex);
                    const lastName = person.name.substring(lastSpaceIndex + 1);
                    formattedName = `${firstName} <strong>${lastName}</strong>`;
                } else {
                    formattedName = person.name;
                }
                
                return `
                    <tr>
                        <td>${formattedName}</td>
                        <td>${person.tableNo}</td>
                    </tr>
                `;
            }).join('');
        }

        // Search functionality
        document.getElementById('searchBox').addEventListener('input', function(e) {
            const searchTerm = e.target.value.trim().toLowerCase();

            if (searchTerm === '') {
                displayData(seatingData);
                return;
            }

            let filtered;
            if (/^[0-9]+$/.test(searchTerm)) {
                // Input is all digits: match table number exactly
                filtered = seatingData.filter(person => person.tableNo.toLowerCase() === searchTerm);
            } else {
                // Input contains letters: substring search for names and table numbers
                filtered = seatingData.filter(person =>
                    person.name.toLowerCase().includes(searchTerm) ||
                    person.tableNo.toLowerCase().includes(searchTerm)
                );
            }

            displayData(filtered);
        });

        // Load data on page load
        loadCSV();
    </script>
</body>
</html>
